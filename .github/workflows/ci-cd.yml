name: MediLoop CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Test Flutter Mobile Application
  flutter-tests:
    name: Flutter App Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

  # Job 2: Test FastAPI Backend & AI Multi-Agent Pipeline
  fastapi-backend-tests:
    name: FastAPI Backend Pytest & AI Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mediloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mediloop
          SECRET_KEY: ci_cd_test_secret_key_123456
        run: |
          cd backend
          pytest -v

  # Job 3: Build & Lint React Dashboard
  react-dashboard-build:
    name: React Dashboard Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          if [ -d "pharmacy dashboard" ]; then
            cd "pharmacy dashboard"
            npm ci
            npm run build
          fi

  # Job 4: Container Build Check
  docker-build-check:
    name: Docker Container Image Validation
    needs: [flutter-tests, fastapi-backend-tests, react-dashboard-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: mediloop-backend:latest
