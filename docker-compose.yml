version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: mediloop-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mediloop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mediloop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediloop-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-mediloop}
      SECRET_KEY: ${SECRET_KEY:-mediloop_enterprise_secure_jwt_secret_key_2026_x98f3a}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - prescription_uploads:/app/uploads/prescriptions
    networks:
      - mediloop-network

  # 3. React Pharmacist Dashboard
  dashboard:
    build:
      context: ./pharmacy-dashboard
      dockerfile: Dockerfile
    container_name: mediloop-dashboard
    restart: always
    networks:
      - mediloop-network

  # 4. Nginx Reverse Proxy Gateway
  proxy:
    image: nginx:alpine
    container_name: mediloop-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - mediloop-network

networks:
  mediloop-network:
    driver: bridge

volumes:
  postgres_data:
  prescription_uploads:
